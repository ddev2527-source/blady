function hostBox(){return '<div class="cd"><div class="tag">'+bt('عنوان استضافة البرنامج','Where this app is hosted')+'</div><input dir="ltr" id="host" placeholder="https://name.github.io/pages/" value="'+esc(ls('host')||(/^https?:/i.test(location.href)?location.href.split('#')[0]:''))+'" oninput="ls(\'host\',this.value)"><div class="mu">'+bt('لازم تكون الصفحة مرفوعة على موقع (مثل GitHub Pages) علشان الرابط يفتح على جوالات الآخرين.','The app must be hosted online (e.g. GitHub Pages) so links open on other phones.')+'</div></div>'}
function editor(){var h='<div class="w"><div class="r"><button class="s n" onclick="goHome()">← '+bt('رجوع','Back')+'</button><div class="tag" style="flex:1;text-align:center">'+bt('تصميم الصفحة','Page design')+'</div></div>'
 +'<div class="cd"><input placeholder="'+bt('عنوان الصفحة','Page title')+'" value="'+esc(D.t)+'" oninput="D.t=this.value;upd()"><input placeholder="'+bt('وصف قصير (اختياري)','Subtitle (optional)')+'" value="'+esc(D.s)+'" oninput="D.s=this.value;upd()"><div class="r" style="margin-top:6px">'+COL.map(function(c){return '<button class="n" style="background:'+c+';width:34px;height:34px;padding:0;border-radius:17px;'+(D.c==c?'outline:3px solid #999;outline-offset:2px':'')+'" onclick="D.c=\''+c+'\';render()"></button>'}).join('')+'</div></div>'
 +'<div id="bl"></div><div class="cd"><div class="tag">'+bt('أضف عنصرًا','Add element')+'</div><div class="tb">'+Object.keys(TYPES).map(function(k){return '<button class="s" onclick="addB(\''+k+'\')">+ '+bt(TYPES[k][0],TYPES[k][1])+'</button>'}).join('')+'</div></div>'
 +'<div class="tag">'+bt('معاينة','Preview')+'</div><div class="pv" id="pv"></div>'
 +'<div class="cd qr"><div class="tag">'+bt('الباركود والرابط','Barcode & link')+'</div><canvas id="qc" width="10" height="10"></canvas><div id="qm" class="mu"></div><div class="lk" id="lk"></div>'
 +'<div class="r" style="margin-top:10px"><button onclick="dlQr()">'+bt('حفظ الباركود','Save QR')+'</button><button class="g" onclick="shWa()">'+bt('واتساب','WhatsApp')+'</button></div><div class="r" style="margin-top:8px"><button class="s" onclick="cpLink()">'+bt('نسخ الرابط','Copy link')+'</button><button class="s" onclick="dlHtml()">'+bt('تنزيل الصفحة HTML','Download HTML')+'</button><button class="s" onclick="window.open(LINK||\'#\')">'+bt('فتح الصفحة','Open page')+'</button></div></div>'+hostBox()+'</div>';
 $('#app').innerHTML=h;blocks();upd()}
function blocks(){var h='';D.b.forEach(function(x,i){var t=x[0],lb=LAB[t];h+='<div class="blk"><div class="r"><span class="tag">'+bt(TYPES[t][0],TYPES[t][1])+'</span><span class="n r"><button class="s n" onclick="mv('+i+',-1)">↑</button><button class="s n" onclick="mv('+i+',1)">↓</button><button class="x n" onclick="rm('+i+')">✕</button></span></div>';
  if(t=='f')h+='<input placeholder="'+bt('العنوان (مثل: الاسم)','Label (e.g. Name)')+'" value="'+esc(x[1])+'" oninput="D.b['+i+'][1]=this.value;upd()"><input placeholder="'+bt('القيمة','Value')+'" value="'+esc(x[2])+'" oninput="D.b['+i+'][2]=this.value;upd()">';
  else if(t=='h'||t=='p')h+='<textarea oninput="D.b['+i+'][1]=this.value;upd()">'+esc(x[1])+'</textarea>';
  else h+='<input placeholder="'+bt(lb[0],'Button text')+'" value="'+esc(x[1])+'" oninput="D.b['+i+'][1]=this.value;upd()"><input dir="ltr" placeholder="'+lb[1]+'" value="'+esc(x[2])+'" oninput="D.b['+i+'][2]=this.value;upd()">';
  h+='</div>'});$('#bl').innerHTML=h}
function addB(k){D.b.push([k,'','']);blocks();upd()}
function rm(i){D.b.splice(i,1);blocks();upd()}
function mv(i,d){var j=i+d;if(j<0||j>=D.b.length)return;var t=D.b[i];D.b[i]=D.b[j];D.b[j]=t;blocks();upd()}
var T=0;
function upd(){var p=$('#pv');if(p)p.innerHTML=pageInner(D);clearTimeout(T);T=setTimeout(mkLink,250)}
function clean(){return {t:D.t,s:D.s,c:D.c,b:D.b.filter(function(x){return x[1]||x[2]})}}
function mkLink(){var b=base();enc(clean()).then(function(e){if(!$('#lk'))return;LINK=(b||'https://YOUR-SITE/')+'#p='+e;$('#lk').textContent=LINK;
 var q=QR.make(LINK,'L'),c=$('#qc');
 if(!q){c.width=c.height=10;$('#qm').textContent=bt('الصفحة طويلة جدًا للباركود — قلّل المحتوى. (الرابط وملف HTML يعملان.)','Too long for a QR — shorten the content. (Link and HTML file still work.)');return}
 var z=q.size,s=Math.max(3,Math.floor(560/(z+8))),n=(z+8)*s,x=c.getContext('2d');c.width=c.height=n;x.fillStyle='#fff';x.fillRect(0,0,n,n);x.fillStyle='#000';var i,j;for(j=0;j<z;j++)for(i=0;i<z;i++)if(q.get(i,j))x.fillRect((i+4)*s,(j+4)*s,s,s);
 $('#qm').textContent=b?bt('امسح الباركود لفتح الصفحة','Scan to open the page'):bt('اكتب عنوان استضافة البرنامج بالأسفل ليعمل الباركود على الجوالات الأخرى','Enter the hosting address below so the QR works on other phones')}).catch(function(){})}
function blobSave(bl,n){var a=document.createElement('a');a.href=URL.createObjectURL(bl);a.download=n;document.body.appendChild(a);a.click();a.remove();setTimeout(function(){URL.revokeObjectURL(a.href)},4000)}
function nm(){return (D.t||'page').replace(/[\\/:*?"<>|]/g,'_')}
function dlQr(){$('#qc').toBlob(function(b){blobSave(b,nm()+'-qr.png')})}
function dlHtml(){blobSave(new Blob([fullHtml(clean())],{type:'text/html'}),nm()+'.html')}
function cpLink(){try{navigator.clipboard.writeText(LINK).then(function(){toast(bt('تم النسخ','Copied'))},function(){toast(bt('تعذّر النسخ','Copy failed'))})}catch(e){toast(bt('تعذّر النسخ','Copy failed'))}}
function shWa(){$('#qc').toBlob(function(b){var f;try{f=new File([b],nm()+'-qr.png',{type:'image/png'})}catch(e){}
 if(f&&navigator.canShare&&navigator.canShare({files:[f]})){navigator.share({files:[f],text:(D.t||'')+'\n'+LINK}).catch(function(){})}else window.open('https://wa.me/?text='+encodeURIComponent((D.t||'')+'\n'+LINK))})}
window.addEventListener('hashchange',function(){if(/^#p=/.test(location.hash)){view='';render()}});
if(/^#p=/.test(location.hash))view='';
render();
if('serviceWorker' in navigator&&/^https?:/.test(location.protocol))navigator.serviceWorker.register('sw.js').catch(function(){});
</script></body></html>
